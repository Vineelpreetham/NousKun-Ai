<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Transparent background -->
  
  <g stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Left vertical bar -->
    <path d="M 30,25 L 30,75" stroke="#4D8EFF" stroke-width="16" />
    
    <!-- Diagonal cross bar -->
    <path d="M 30,25 L 70,75" stroke="#4D8EFF" stroke-width="16" />
    
    <!-- Right vertical bar -->
    <path d="M 70,25 L 70,75" stroke="#4D8EFF" stroke-width="16" />

    <!-- Node connection circle on the Top Right of Left Bar (Origin of cross) -->
    <circle cx="30" cy="25" r="5" fill="#121212" stroke="#4D8EFF" stroke-width="3" />
    
    <!-- Node connection circle on the Bottom Left of Right Bar (End of cross) -->
    <circle cx="70" cy="75" r="5" fill="#121212" stroke="#4D8EFF" stroke-width="3" />
    
  </g>
</svg>
